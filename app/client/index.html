<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1b10">
  <title>Juegos · dsbelda.dev</title>
  <meta name="description" content="Juegos para jugar con amigos: cartas, tablero, dibujo y más.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <header class="cab">
      <h1>Salón de juegos</h1>
      <p class="muted">Juegos para jugar con amigos. Sin cuentas, sin descargas.</p>
    </header>

    <section class="win filtros" aria-label="Filtros">
      <input id="q" type="search" placeholder="Buscar juego…" autocomplete="off" aria-label="Buscar juego">
      <div class="grupo" data-filtro="jugadores"><span>Jugadores</span></div>
      <div class="grupo" data-filtro="duracion"><span>Duración</span></div>
      <div class="grupo" data-filtro="tipo"><span>Tipo</span></div>
      <div class="grupo" data-filtro="modo"><span>Modo</span></div>
      <label class="check"><input id="solo-listos" type="checkbox"> Solo los que ya se pueden jugar</label>
      <button id="limpiar" type="button">Limpiar filtros</button>
    </section>

    <p id="cuenta" class="muted" aria-live="polite"></p>
    <section id="lista" class="rejilla" aria-label="Juegos"></section>
    <footer class="muted pie">Hecho por David · <a href="https://dsbelda.dev">dsbelda.dev</a></footer>
  </main>
  <script src="/js/portal.js"></script>
</body>
</html>
